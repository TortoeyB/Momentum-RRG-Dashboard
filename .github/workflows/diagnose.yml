name: Diagnose Indicators

# รันมือจากหน้า Actions เท่านั้น — ไม่แตะ data.json ไม่ commit อะไรทั้งสิ้น
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'สัญลักษณ์ที่ต้องการตรวจ (คั่นด้วยเว้นวรรค)'
        required: true
        default: 'DAPP COPX NFLX'
      period:
        description: 'ช่วงข้อมูลย้อนหลัง'
        required: false
        default: '3y'
        type: choice
        options: ['1y', '2y', '3y', '5y', 'max']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q scripts

      - name: Run diagnose
        shell: bash
        env:
          DIAGNOSE_PERIOD: ${{ inputs.period }}
        run: |
          set -o pipefail
          python scripts/diagnose.py ${{ inputs.symbols }} 2>&1 | tee diagnose_output.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-report
          path: diagnose_output.txt
          retention-days: 14
